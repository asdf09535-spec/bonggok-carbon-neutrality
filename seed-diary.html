      const createdAt = new Date(d.date + "T16:00:00+09:00").getTime() + n * 60000;
      await addDoc(collection(db, "diary"), { ...d, createdAt });
      n++;
    }
    log.innerHTML = `✅ diary: ${n}개 등록 완료! 이 파일은 GitHub에서 삭제해 주세요.`;
  }
} catch (e) {
  console.error(e);
  log.innerHTML = "❌ 실패: " + e.message;
}
</script></body></html>
