<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>서약서 이전</title></head>
<body><h2 id="msg">이전 중...</h2>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyBtUnIx0_PH3VCZk8wYlcLPQfnZ7r5vrz4",
  authDomain: "bonggok-carbon-neutrality.firebaseapp.com",
  databaseURL: "https://bonggok-carbon-neutrality-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bonggok-carbon-neutrality",
  appId: "1:742763830070:web:2b458f95c40d220ffff197"
});
const msg = document.getElementById("msg");
try {
  const snap = await get(ref(getDatabase(app), "pledges"));
  const fs = getFirestore(app);
  let n = 0;
  for (const [key, v] of Object.entries(snap.val() || {})) {
    await addDoc(collection(fs, "pledges"), {
      name: v.name || "", date: v.date || "", text: v.text || "",
      promise: v.promise || "", createdAt: v.createdAt || Date.now()
    });
    n++;
  }
  msg.textContent = `✅ ${n}개 이전 완료! 이 페이지는 다시 열지 마세요.`;
} catch (e) { msg.textContent = "❌ 실패: " + e.message; console.error(e); }
</script></body></html>
